<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكهرمان | منتجات طبيعية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1b4d45;--g2:#143a34;--c:#c48a5e;--c2:#a97246;--bg:#f4f7f5;--ink:#15302b;--mut:#5d716c;--ln:#dbe4e0}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.hero{background:var(--g);color:#fff;padding:28px 20px 56px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 44px}
.brand{font-family:Amiri,serif;font-size:30px;color:var(--c)}
.cartbtn{background:transparent;border:1.5px solid var(--c);color:var(--c);border-radius:99px;padding:6px 18px;cursor:pointer}
.cartbtn b{background:var(--c);color:var(--g2);border-radius:99px;padding:0 8px;margin-inline-start:6px}
h1{font-family:Amiri,serif;font-size:clamp(34px,6vw,60px);line-height:1.35;max-width:760px;margin:0 auto 12px}
.hero p{color:#cfe0da;max-width:560px;margin:0 auto 26px}
.sbox{max-width:560px;margin:0 auto;position:relative}
.sbox input{width:100%;padding:15px 22px;border-radius:99px;border:2px solid transparent;font-size:17px;background:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:5px 16px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chips.sub .chip{font-size:14px;padding:3px 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin-top:20px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#e4ece8;display:block}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb small{color:var(--mut)}
.pr{color:var(--c2);font-weight:700;font-size:18px}
.add{margin-top:auto;background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px;cursor:pointer;font-weight:500}
.add:disabled{background:#aeb9b5;cursor:default}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:20px}
.fold{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;text-align:start;padding:0;display:block;width:100%}
.fold:hover{border-color:var(--c)}
.fold img,.fold .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.fold .t{padding:12px 16px}.fold b{display:block;font-size:18px}.fold small{color:var(--mut)}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--c2);cursor:pointer;font-weight:700;padding:0}
.note{color:var(--mut);margin-top:16px}
.sec{background:#fff;border-top:1px solid var(--ln)}
.sec h2,.wrap h2{font-family:Amiri,serif;font-size:30px;color:var(--g);margin-bottom:6px}
.sec p{max-width:70ch;white-space:pre-line}
footer{background:var(--g2);color:#cfe0da;text-align:center;padding:28px 20px}
.wa{display:inline-block;background:var(--c);color:var(--g2);font-weight:700;border-radius:99px;padding:10px 26px;text-decoration:none;margin-top:8px}
#dr{position:fixed;inset:0 auto 0 0;width:min(420px,100%);background:#fff;box-shadow:0 0 40px #0004;transform:translateX(-105%);transition:transform .25s;z-index:9;display:flex;flex-direction:column}
#dr.open{transform:none}
#dr header{padding:16px 18px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;font-weight:700}
#items{flex:1;overflow:auto;padding:10px 18px}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);align-items:center}
.q button{width:28px;height:28px;border-radius:6px;border:1px solid var(--ln);background:#fff;cursor:pointer}
#fm{padding:14px 18px;border-top:1px solid var(--ln);display:grid;gap:8px}
#fm input,#fm select,#fm textarea{padding:9px 12px;border:1px solid var(--ln);border-radius:8px;width:100%}
#qr{max-width:200px;display:none;margin:auto;border-radius:8px}
.x{background:none;border:0;font-size:22px;cursor:pointer}
@media(prefers-reduced-motion:reduce){#dr{transition:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="top"><div class="brand">الكهرمان</div><button class="cartbtn" id="cb">السلة<b id="cn">0</b></button></div>
  <h1 id="hl">من الطبيعة إلى بشرتك وشعرك، بكل رقّة</h1>
  <p id="sb">منتجات عناية طبيعية مختارة بعناية، صافية في مكوّناتها ولطيفة في أثرها.</p>
  <div class="sbox"><input id="q" type="search" placeholder="ابحث عن منتج… مثال: زيت لوز" aria-label="بحث"></div>
</section>
<main class="wrap">
  <div class="chips" id="cats"></div><div class="chips sub" id="subs"></div>
  <div class="note" id="sg"></div>
  <div class="grid" id="gr"></div>
</main>
<div id="secs"></div>
<footer><h2 style="font-family:Amiri,serif;color:#fff;font-size:28px">تواصل معنا</h2><p>اسألنا عن أي منتج، ونرد عليك بأسرع وقت.</p><a class="wa" id="wl" target="_blank" rel="noopener">راسلنا على واتساب</a><p style="margin-top:16px;font-size:14px">© الكهرمان</p></footer>

<aside id="dr" aria-label="السلة">
  <header><span>سلة المشتريات</span><button class="x" id="cx" aria-label="إغلاق">×</button></header>
  <div id="items"></div>
  <form id="fm">
    <b id="tot"></b>
    <input id="nm" placeholder="الاسم" required><input id="ad" placeholder="العنوان" required>
    <textarea id="nt" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
    <select id="pay"><option value="الدفع عند الاستلام">الدفع عند الاستلام</option></select>
    <img id="qr" alt="كود شام كاش">
    <button class="add" style="padding:12px">إرسال الطلب عبر واتساب</button>
  </form>
</aside>

<script>
const API = "PASTE_WEB_APP_URL_HERE";
let D = {products:[],categories:[],sections:[],config:{}}, cat="", sub="", cart=JSON.parse(localStorage.getItem("cart")||"{}");
const $ = i => document.getElementById(i), fmt = n => Number(n).toLocaleString("en-US")+" ل.س.ج";
const el = (t,c,x) => {const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e};

const DEMO = {products:[
 {id:"1",name:"زيت اللوز الحلو",cat:"زيوت",sub:"بشرة",desc:"زيت لوز مضغوط على البارد",price:45000,image:"",stock:1},
 {id:"2",name:"صابون زيت الزيتون",cat:"صوابين",sub:"جسم",desc:"صابون طبيعي",price:20000,image:"",stock:1}],
 categories:[{cat:"زيوت",subs:"بشرة|شعر"},{cat:"صوابين",subs:"بشرة|جسم"}],sections:[],config:{whatsapp:"963960052632"}};

async function load(){
  if(API.startsWith("PASTE")) D = DEMO;
  else try{ D = await (await fetch(API)).json(); }catch(e){ $("gr").textContent="تعذّر تحميل المنتجات، حدّث الصفحة."; return; }
  const c = D.config||{};
  if(c.headline) $("hl").textContent=c.headline; if(c.sub) $("sb").textContent=c.sub;
  const wa=String(c.whatsapp||"963960052632").replace(/\D/g,"");
  $("wl").href="https://wa.me/"+wa;
  if(c.shamcash){const o=el("option",null,"شام كاش"); o.value="شام كاش"; $("pay").append(o);}
  D.sections.forEach(s=>{const d=el("section","sec"),w=el("div","wrap"); w.append(el("h2",null,s.title),el("p",null,s.body)); d.append(w); $("secs").append(d)});
  chips(); show(); cartUI();
}

/* بحث ذكي: تطبيع الحروف العربية + مسافة التعديل */
const norm = s => String(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ؤئ]/g,"ء");
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return m[b.length]}
function hit(tokens,w,fuzzy){return tokens.some(t=>t.includes(w)||(fuzzy&&w.length>=3&&lev(t.slice(0,w.length+1),w)<=(w.length>=7?2:1)))}
function search(list,q){
  const ws=norm(q).split(/\s+/).filter(Boolean); if(!ws.length) return {r:list,near:false};
  const tk=p=>norm([p.name,p.cat,p.sub,p.desc].join(" ")).split(/\s+/);
  let r=list.filter(p=>ws.every(w=>hit(tk(p),w,false)));
  if(r.length) return {r,near:false};
  r=list.filter(p=>ws.every(w=>hit(tk(p),w,true)));
  if(!r.length) r=list.filter(p=>ws.some(w=>hit(tk(p),w,true)));
  return {r,near:true};
}

const cnt=n=>n===1?"منتج واحد":n===2?"منتجان":n+(n<11?" منتجات":" منتجًا");
function cover(f){const p=D.products.find(x=>x.image&&f(x));return p?p.image:""}
function folder(t,n,img,go){
  const b=el("button","fold");
  if(img){const i=el("img");i.src=img;i.alt=t;i.loading="lazy";b.append(i)}else b.append(el("div","ph"));
  const d=el("div","t");d.append(el("b",null,t),el("small",null,cnt(n)));b.append(d);b.onclick=()=>{go();scrollTo(0,0)};return b}
function chips(){
  const c=$("cats");c.replaceChildren();c.className="crumb";$("subs").replaceChildren();
  if(!cat)return;
  const a=el("button",null,"الكل");a.onclick=()=>{cat="";sub="";show()};
  const b=el("button",null,cat);b.onclick=()=>{sub="";show()};
  c.append(a,el("span",null,"›"),b);
  if(sub)c.append(el("span",null,"›"),el("b",null,sub));
}
function show(){
  chips();
  const q=$("q").value.trim(),g=$("gr");g.replaceChildren();$("sg").textContent="";
  const cur=D.categories.find(x=>x.cat===cat),subs=cur?String(cur.subs||"").split("|").map(x=>x.trim()).filter(Boolean):[];
  let items=D.products.filter(p=>(!cat||p.cat===cat)&&(!sub||p.sub===sub)),folders=false;
  if(!q&&!cat){
    g.className="fgrid";
    D.categories.forEach(x=>g.append(folder(x.cat,D.products.filter(p=>p.cat===x.cat).length,cover(p=>p.cat===x.cat),()=>{cat=x.cat;sub="";show()})));
    if(!D.categories.length)g.append(el("p","note","لا توجد تصنيفات بعد."));
    return}
  if(!q&&cat&&!sub&&subs.length){
    folders=true;
    subs.forEach(s=>g.append(folder(s,D.products.filter(p=>p.cat===cat&&p.sub===s).length,cover(p=>p.cat===cat&&p.sub===s),()=>{sub=s;show()})));
    items=items.filter(p=>!subs.includes(p.sub))}
  g.className=folders?"fgrid":"grid";
  const {r,near}=q?search(items,q):{r:items,near:false};
  $("sg").textContent=q&&near&&r.length?"لا توجد نتيجة مطابقة تمامًا. هذه أقرب النتائج:":"";
  if(!r.length&&!folders){g.append(el("p","note",q?"لم نجد منتجًا بهذا الاسم. جرّب كلمة أخرى.":"لا توجد منتجات في هذا التصنيف بعد."));return}
  r.forEach(p=>{
    const c=el("div","card");
    if(p.image){const i=el("img");i.src=p.image;i.alt=p.name;i.loading="lazy";c.append(i)}else c.append(el("div","ph"));
    const b=el("div","cb");b.append(el("b",null,p.name),el("small",null,[p.cat,p.sub].filter(Boolean).join(" · ")));
    if(p.desc)b.append(el("small",null,p.desc));
    b.append(el("div","pr",fmt(p.price)));
    const a=el("button","add",Number(p.stock)?"أضف إلى السلة":"نفد المخزون");a.disabled=!Number(p.stock);
    a.onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;saveCart();$("dr").classList.add("open")};b.append(a);c.append(b);g.append(c)});
}
$("q").addEventListener("input",show);

function saveCart(){localStorage.setItem("cart",JSON.stringify(cart));cartUI()}
function cartUI(){
  const ids=Object.keys(cart).filter(i=>D.products.some(p=>p.id==i)); let tot=0,n=0; const box=$("items"); box.replaceChildren();
  if(!ids.length) box.append(el("p","note","السلة فارغة. أضف منتجًا لتبدأ."));
  ids.forEach(i=>{const p=D.products.find(x=>x.id==i); tot+=p.price*cart[i]; n+=cart[i];
    const r=el("div","it"), q=el("span","q"), m=el("button",null,"−"), pl=el("button",null,"+");
    m.onclick=()=>{cart[i]--; if(cart[i]<1)delete cart[i]; saveCart()}; pl.onclick=()=>{cart[i]++;saveCart()};
    q.append(m,el("b",null," "+cart[i]+" "),pl);
    r.append(el("span",null,p.name),q,el("span",null,fmt(p.price*cart[i]))); box.append(r)});
  $("cn").textContent=n; $("tot").textContent="المجموع: "+fmt(tot); $("fm").style.display=ids.length?"grid":"none";
}
$("cb").onclick=()=>$("dr").classList.add("open"); $("cx").onclick=()=>$("dr").classList.remove("open");
$("pay").onchange=()=>{const s=$("pay").value==="شام كاش"&&D.config.shamcash; $("qr").style.display=s?"block":"none"; if(s)$("qr").src=D.config.shamcash};
$("fm").onsubmit=e=>{
  e.preventDefault(); let tot=0,L=[];
  Object.keys(cart).forEach(i=>{const p=D.products.find(x=>x.id==i); if(!p)return; tot+=p.price*cart[i]; L.push("• "+p.name+" × "+cart[i]+" = "+fmt(p.price*cart[i]))});
  const msg=["طلب جديد من موقع الكهرمان","",...L,"","المجموع: "+fmt(tot),"الاسم: "+$("nm").value,"العنوان: "+$("ad").value,"الدفع: "+$("pay").value,$("nt").value?"ملاحظات: "+$("nt").value:""].join("\n");
  const wa=String(D.config.whatsapp||"963960052632").replace(/\D/g,"");
  window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(msg),"_blank");
};
load();
</script>
</body>
</html>
